# Optional Kitty graphics support for the nvim-extras LaTeX renderer.
# Source explicitly only if your main tmux config does not own these settings.
# This enables passthrough globally, not just for pi-console panes.
set -g allow-passthrough on
set -g focus-events on

# Ordinary clients need one wrapper; clients inside a tmux popup need two.
# Expand both the hook's client session and depth before executing set-option.
set-hook -g client-active[90] {
  run-shell -C 'set-option -q -t "#{client_session}" @graphics-nest-count "#{?#{==:#{client_termname},#{default-terminal}},2,1}"'
}
set-hook -g client-attached[90] {
  run-shell -C 'set-option -q -t "#{client_session}" @graphics-nest-count "#{?#{==:#{client_termname},#{default-terminal}},2,1}"'
}
set-hook -g client-focus-in[90] {
  run-shell -C 'set-option -q -t "#{client_session}" @graphics-nest-count "#{?#{==:#{client_termname},#{default-terminal}},2,1}"'
}
set-hook -g client-session-changed[90] {
  run-shell -C 'set-option -q -t "#{client_session}" @graphics-nest-count "#{?#{==:#{client_termname},#{default-terminal}},2,1}"'
}
