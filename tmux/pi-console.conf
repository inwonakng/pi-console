# pi-console tmux integration
#
# Set @pi_console_root to this repository's absolute path before sourcing this file:
#   set -g @pi_console_root "/path/to/pi-console"
#   source-file "/path/to/pi-console/tmux/pi-console.conf"

# Preserve modified Enter keys used by the Neovim input buffer.
if -F '#{extended-keys}' 'set -g extended-keys on'
if -F '#{extended-keys-format}' 'set -g extended-keys-format csi-u'

# Permit the nvim-extras LaTeX renderer to send Kitty graphics.
set -g allow-passthrough on
set-hook -g client-active[90] \
  'set-option -q -t "#{client_session}" @graphics-nest-count "#{?#{==:#{client_termname},#{default-terminal}},2,1}"'
set-hook -g client-attached[90] \
  'set-option -q -t "#{client_session}" @graphics-nest-count "#{?#{==:#{client_termname},#{default-terminal}},2,1}"'
set-hook -g client-focus-in[90] \
  'set-option -q -t "#{client_session}" @graphics-nest-count "#{?#{==:#{client_termname},#{default-terminal}},2,1}"'
set-hook -g client-session-changed[90] \
  'set-option -q -t "#{client_session}" @graphics-nest-count "#{?#{==:#{client_termname},#{default-terminal}},2,1}"'

# Toggle pi-console, start a conversation, or focus the persistent overview.
bind-key g run-shell "bash '#{@pi_console_root}/tmux/scripts/toggle-popup-agents.sh' '#{pane_id}' '#{client_name}'"
bind-key G run-shell "bash '#{@pi_console_root}/tmux/scripts/open-agents-window.sh' '#{pane_id}' '#{client_name}'"
bind-key o run-shell "bash '#{@pi_console_root}/tmux/scripts/open-agents-overview.sh' '#{pane_id}' '#{client_name}'"
