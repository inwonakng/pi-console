# pi-console tmux integration

# Preserve modified Enter keys used by the Neovim input buffer.
if -F '#{extended-keys}' 'set -g extended-keys on'
if -F '#{extended-keys-format}' 'set -g extended-keys-format csi-u'

# Click panes and forward mouse scrolling to Neovim.
set -g mouse on

# Conversation completion badges follow pane and terminal focus.
set -g focus-events on

# Graphics passthrough is host policy; see graphics.conf for optional setup.
# setup.sh installs the popup lifecycle hook using this channel's helper path.

# Toggle pi-console, start a conversation, or toggle the persistent overview.
bind-key g run-shell "pi-console tmux toggle '#{pane_id}' '#{client_name}'"
bind-key G run-shell "pi-console tmux new '#{pane_id}' '#{client_name}'"
bind-key o run-shell "pi-console tmux overview '#{pane_id}' '#{client_name}'"
bind-key O run-shell "pi-console tmux sidebar '#{pane_id}'"
