# Optional pi-console extension settings.
# Copy this file to ~/.pi/agent/pi-console-config.yaml and change only the
# values you want to override. Extension changes are read on demand.
# Defaults apply on session start or tree navigation when no saved session
# choice exists. Saved choices take precedence over these defaults.

notifications:
  # enabled | disabled
  default: enabled

integration-mode:
  # ask | allowed
  default: ask

access-mode:
  # readonly | ask | edit | full
  default: ask
  # Defaults: all reads (including credentials), and writes under /tmp.
  # These lists add to workspace/system reads and mode-specific writes.
  # Use read-paths: [] to restrict reads, or write-paths: [] to remove /tmp.
  read-paths: ["/"]
  write-paths: ["/tmp"]
  # Optional absolute or ~/ prefix for unique scratch directories.
  # Omitted: use the OS temp directory. Takes effect on the next Pi session.
  # The generated directory is always writable and removed on shutdown.
  # temp-dir-prefix: /tmp/pi-console-
  # Optional macOS diagnostic log reader; sandbox enforcement stays enabled.
  # true runs continuously until shutdown, including while idle. Restart the
  # session after changing this. Suppressed failures may go unreported when off.
  macos-denial-monitor: false

session-picker:
  archive-after-days: 180

