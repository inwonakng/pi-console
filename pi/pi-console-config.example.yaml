# Optional pi-console settings.
# Copy to ${XDG_CONFIG_HOME:-~/.config}/pi-console/config.yaml for stable,
# or config-dev.yaml in the same directory for dev. Change only the values
# you want to override. Extension changes are read on demand.
# Defaults apply on session start or tree navigation when no saved session
# choice exists. Saved choices take precedence over these defaults.

# Web frontend changes require restarting the matching service.
# Disabled by default; anyone who can reach the port has access (no authentication).
server:
  # Shared HTTP/WS port for host connections and the web frontend (1-65535).
  port: 8443
  webui:
    enabled: false
    # Additional dashboard origins for reverse proxies; restart after changes.
    # Exact http:// or https:// origins, without paths or trailing slashes.
    allowed-origins: []
    # allowed-origins: ["https://pi.hyrax-pollux.ts.net"]

notifications:
  # enabled | disabled
  default: enabled

integration-mode:
  # ask | allowed
  default: ask

workspace:
  # Create one descriptive local commit per top-level integration. Never pushes.
  # Uses your Git identity; Git commit hooks are not run. Verify before integrating.
  # Off by default. Reverts always create a new commit, even when this is off.
  auto-commit: false

access-mode:
  # readonly | ask | edit | full
  default: ask
  # Defaults: all reads (including credentials), and writes under /tmp.
  # These lists add to workspace/system reads and mode-specific writes.
  # Use read-paths: [] to restrict reads, or write-paths: [] to remove /tmp.
  read-paths: ["/"]
  write-paths: ["/tmp"]
  # Optional absolute or ~/ prefix for unique scratch directories.
  # Omitted: use the OS temp directory. Takes effect on the next Pi session.
  # The generated directory is always writable and removed on shutdown.
  # temp-dir-prefix: /tmp/pi-console-
  # Optional macOS diagnostic log reader; sandbox enforcement stays enabled.
  # true runs continuously until shutdown, including while idle. Restart the
  # session after changing this. Suppressed failures may go unreported when off.
  macos-denial-monitor: false

session-picker:
  archive-after-days: 180

# Defaults for newly spawned workers, keyed by profile name (or generic role).
# IDs must exactly match Pi's registry; use spawn_control action=models to inspect.
# This does not change the parent session model. No personal choices are bundled.
# subagents:
#   models:
#     worker:
#       provider: exact-provider-id
#       model: exact-model-id

# auto-title:
#   provider-models:
#     provider-id: model-id
