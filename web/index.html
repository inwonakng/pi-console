<!doctype html>
<html lang="en" data-pi-channel="{{PI_CONSOLE_CHANNEL}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#171b1a">
  <title>pi-console</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="app-header">
    <a class="wordmark" href="#">pi<span>/</span>console</a>
    <form id="connection-form" class="connection-form">
      <span id="channel" aria-label="Server channel"></span>
      <button id="connect" type="submit">Connect</button>
    </form>
  </header>
  <div id="notice" class="notice" role="alert" hidden></div>
  <nav id="tabs" aria-label="Open conversations"><a id="overview-tab" href="#" aria-current="page">Overview</a><div id="conversation-tabs"></div></nav>
  <main id="panels">
    <section id="overview" aria-label="Session overview" tabindex="-1">
      <div class="overview-heading"><h1>Open sessions <span id="session-count">0</span></h1><div class="actions"><button id="history">History</button><button id="new-session" disabled>New session</button></div></div>
      <div class="filters">
        <label for="search">Filter sessions<input id="search" type="search" placeholder="Title, directory or host" autocomplete="off"></label>
        <label for="host-filter">Host<select id="host-filter"><option value="">All hosts</option></select></label>
      </div>
      <details class="hosts-panel">
        <summary>Execution hosts <span id="connection-state" role="status">Disconnected</span></summary>
        <div id="hosts" aria-label="Registered hosts"></div>
      </details>
      <nav id="session-list" aria-label="Open sessions"><p class="empty">Connect to see sessions across registered hosts.</p></nav>
    </section>
  </main>
  <template id="conversation-template">
    <section class="conversation" aria-label="Conversation" tabindex="-1" hidden>
      <div data-id="notice" class="notice" role="alert" hidden></div>
      <header class="session-header">
        <div class="session-heading"><div class="session-title-row"><h2 data-id="session-title"></h2><span data-id="session-status" class="status"></span></div><p data-id="session-directory"></p></div>
        <button data-id="reconnect" hidden>Reconnect</button>
        <details data-id="session-actions" class="session-actions">
          <summary>Actions</summary>
          <div class="actions">
            <button data-id="new-workspace">New in this workspace</button>
            <button data-id="rename" disabled>Rename session</button>
            <button data-id="stop" class="danger" disabled>Stop session</button>
          </div>
        </details>
      </header>
      <div class="control-bar"><span data-id="controller" role="status">Read only</span><button data-id="control" disabled>Take control</button><button data-id="abort" disabled>Stop turn</button></div>
      <details data-id="settings" class="settings-panel">
        <summary>Model and settings <span data-id="settings-model" class="muted"></span></summary>
        <div data-id="settings-fields" class="settings-fields"></div>
        <div class="settings-footer"><span data-id="settings-hint" role="status">Take control to change settings.</span><button data-id="refresh-settings" type="button">Refresh options</button></div>
      </details>
      <div data-id="transcript" class="transcript" tabindex="0" aria-label="Conversation transcript"></div>
      <button data-id="latest" class="latest" hidden>Jump to latest</button>
      <details data-id="interactions" class="interactions" hidden>
        <summary data-id="interaction-summary">Questions and approvals</summary>
        <div data-id="interaction-list"></div>
      </details>
      <details data-id="queue-panel" class="queue-panel" hidden><summary data-id="queue-summary">Queued prompts</summary><div data-id="queue"></div></details>
      <form data-id="composer" class="composer">
        <label data-id="prompt-label">Prompt</label>
        <textarea data-id="prompt" rows="3" placeholder="Write a prompt..." disabled></textarea>
        <div class="composer-footer"><span data-id="composer-hint">Take control to send a prompt.</span><button data-id="send" type="submit" disabled>Send</button></div>
      </form>
      <p data-id="command-status" class="command-status" role="status"></p>
    </section>
  </template>
  <dialog id="create-dialog">
    <form id="create-form">
      <h2>New session</h2>
      <label for="create-host">Execution host</label><select id="create-host" required></select>
      <label for="cwd">Directory on the host</label>
      <input id="cwd" placeholder="/absolute/project/path" required autocomplete="off">
      <p class="muted">Use the execution host's path, not this device's.</p>
      <div class="dialog-actions"><button id="cancel-create" type="button">Cancel</button><button type="submit">Create session</button></div>
    </form>
  </dialog>
  <dialog id="history-dialog">
    <header class="dialog-heading"><h2>Session history</h2><button id="close-history">Close</button></header>
    <div class="filters"><label for="history-search">Filter history<input id="history-search" type="search" autocomplete="off"></label><label for="history-host">Host<select id="history-host"><option value="">All hosts</option></select></label></div>
    <p class="muted">Stopped sessions stay here until you explicitly resume them.</p>
    <div id="history-list"></div>
  </dialog>
  <noscript>This frontend needs JavaScript to connect to pi-console.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
