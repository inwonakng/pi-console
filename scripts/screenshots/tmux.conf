# Neutral tmux look for screenshots. Set SCREENSHOT_TMUX_CONF to use your own.
set -g default-terminal tmux-256color
set -as terminal-features ',*:RGB'
set -g escape-time 10
set -g status-style 'bg=#1a1b21,fg=#abb2bf'
set -g status-left ' '
set -g status-right ''
set -g window-status-format ' #I #W '
set -g window-status-current-format ' #I #W '
set -g window-status-current-style 'fg=#e6e6e6,bg=#2c2e36,bold'
set -g popup-border-lines rounded
set -g popup-border-style 'fg=#5c6370'
